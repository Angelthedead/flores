<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti 🌷</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #0a0a2a, #11071d, #1a0826);
            height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            color: white;
            touch-action: manipulation;
        }

        /* Pantalla de Inicio - Elegant Buildup */
        #start-screen {
            position: absolute;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            width: 100%;
            height: 100%;
            justify-content: center;
            transition: opacity 2s ease;
            background: linear-gradient(to bottom, #0a0a2a, #11071d, #1a0826);
        }

        #start-screen h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.7);
            animation: textGlow 2s infinite alternate;
        }

        #name-input {
            padding: 18px 25px;
            font-size: 1.3rem;
            border-radius: 40px;
            border: 2px solid #ff007f;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            text-align: center;
            margin-bottom: 30px;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.4s ease;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
            width: 80%;
            max-width: 320px;
        }

        #name-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        #name-input:focus {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.9);
            border-color: #ff3399;
        }

        #start-btn {
            background: linear-gradient(45deg, #ff007f, #b3003b);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.6rem;
            font-family: 'Dancing Script', cursive;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(0,0,0,0.6), 0 0 20px rgba(255, 0, 127, 0.5);
            transition: all 0.3s;
            z-index: 110;
        }

        #start-btn:hover {
            transform: scale(1.06) translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.7), 0 0 30px rgba(255, 0, 127, 0.9);
        }

        @keyframes textGlow {
            to { text-shadow: 0 0 25px rgba(255, 105, 180, 1), 0 0 10px white; }
        }

        /* Mensajes - Centralizados */
        #message-container {
            position: absolute;
            top: 25%;
            width: 90%;
            max-width: 600px;
            text-align: center;
            z-index: 50;
            opacity: 0;
            transition: opacity 1.5s ease;
            pointer-events: none;
        }

        #message-text {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 20px #ff007f;
            animation: breatheMessage 5s infinite alternate;
            line-height: 1.2;
        }

        @keyframes breatheMessage {
            0% { transform: scale(0.99) translateY(0); opacity: 0.85; }
            100% { transform: scale(1.02) translateY(-5px); opacity: 1; }
        }

        /* --- Gatito y Estambre --- */
        #progress-wrapper {
            position: absolute;
            bottom: 30px;
            left: 5%;
            width: 90%;
            height: 40px;
            z-index: 150;
            opacity: 0;
            transition: opacity 1.5s ease;
            pointer-events: none;
        }

        #progress-line {
            position: absolute;
            bottom: 5px;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            overflow: hidden; 
        }

        #progress-fill {
            position: absolute;
            bottom: 0px;
            left: 0;
            width: 0%;
            height: 4px; 
            background: #ff007f;
            border-radius: 4px;
            box-shadow: 0 0 10px #ff007f, 0 0 5px white;
        }

        #cat-scene-main {
            position: absolute;
            bottom: 9px; 
            left: 0%;
            display: flex;
            align-items: center;
            font-size: 1.8rem; 
            transform: translateX(-15px); 
        }

        #cat {
            animation: catWalk 0.8s infinite alternate ease-in-out;
            transform-origin: bottom center;
        }

        #yarn-custom {
            width: 24px;
            height: 24px;
            margin-left: 4px;
            background: #ff007f; 
            border-radius: 50%;
            position: relative;
            box-shadow: 
                inset 2px 2px 5px rgba(255, 255, 255, 0.3),
                inset -2px -2px 5px rgba(0, 0, 0, 0.3),
                0 0 8px rgba(255, 0, 127, 0.6);
            overflow: hidden; 
        }

        #yarn-custom::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 2px,
                rgba(255, 255, 255, 0.1) 2px,
                rgba(255, 255, 255, 0.1) 4px
            );
        }

        .run-progress #progress-fill { animation: fillProgress 60s linear forwards; }
        .run-progress #cat-scene-main { animation: moveCat 60s linear forwards; }
        .run-progress #yarn-custom { animation: spinYarnCSS 60s linear forwards; }

        @keyframes fillProgress { to { width: 100%; } }
        @keyframes moveCat { to { left: calc(100% - 50px); } }
        @keyframes spinYarnCSS { to { transform: rotate(2500deg); } }
        @keyframes catWalk {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px) rotate(2deg); }
        }

        /* Jardín Base */
        #garden {
            position: absolute;
            bottom: -50px;
            width: 100vw;
            height: 45vh;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            z-index: 10;
        }

        .flower-container {
            position: relative;
            transform-origin: bottom center;
            cursor: pointer;
            opacity: 0;
            transform: scaleY(0);
        }

        .flower-container.grow { animation: growFlower 3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .flower-container.sway { animation: swayBreeze 7s infinite ease-in-out alternate; }

        @keyframes growFlower {
            0% { transform: scaleY(0) scaleX(0.4); opacity: 0; }
            40% { opacity: 1; }
            100% { transform: scaleY(1) scaleX(1); opacity: 1; }
        }

        @keyframes swayBreeze {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        .flower-container.bloom { animation: bloomEffect 0.7s ease-out; }

        @keyframes bloomEffect {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.25); filter: brightness(1.7) drop-shadow(0 0 15px #ff007f); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* Pétalos cayendo */
        #petals-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            overflow: hidden;
        }

        .falling-petal {
            position: absolute;
            top: -10%;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg) translateX(70px); opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="start-screen">
        <h1>Bienvenida a tu jardín...</h1>
        <input type="text" id="name-input" placeholder="Escribe tu nombre aquí..." autocomplete="off">
        <button id="start-btn">Toca para ver el mensaje</button>
    </div>

    <div id="message-container">
        <div id="message-text"></div>
    </div>

    <div id="petals-container"></div>
    <div id="garden"></div>

    <div id="progress-wrapper">
        <div id="progress-line">
            <div id="progress-fill"></div>
        </div>
        <div id="cat-scene-main">
            <div id="cat">🐈</div>
            <div id="yarn-custom"></div>
        </div>
    </div>

    <script>
        const colors = ['#8B0000', '#C8A2C8', '#FF8C00', '#FDFBF7', '#FF00FF', '#FF007F', '#66001a'];
        
        let messages = [];
        let userName = "";
        let finalMessage = "";
        let msgIndex = 0;
        let msgInterval;
        let msgTimeout;

        document.getElementById('start-btn').addEventListener('click', () => {
            const inputVal = document.getElementById('name-input').value.trim();
            userName = inputVal !== "" ? inputVal : "mi amor"; 
            
            // Lógica inteligente para elegir las frases según el nombre
            const nameKey = userName.toLowerCase();

            if (nameKey === 'meraly') {
                // Colección 1: Fuego intenso y pasión pura (Exclusivo para Meraly)
                messages = [
                    `${userName}, cada pétalo que ves aquí es un suspiro mío deseando tu piel...`,
                    "Tu recuerdo es el fuego que enciende mis instintos más profundos.",
                    "Me imagino recorriendo cada curva de tu cuerpo, despacio, muy despacio...",
                    "Estas flores son hermosas, pero nada se compara con tu desnudez.",
                    "Lo que más deseo ahora mismo es sentir tu calor contra el mío.",
                    "Eres mi tentación más dulce, mi obsesión más ardiente.",
                    "Deja que tu imaginación vuele... piensa en lo que te haría si estuviera ahí.",
                    "Ven a mis sueños esta noche y déjame cumplir todos tus deseos.",
                    "No puedo esperar ni un segundo más para tenerte.",
                    "Toca las flores... y siénteme a tu lado."
                ];
                finalMessage = `Te deseo y te amo, ${userName} 🔥❤️`;

            } else if (nameKey.length <= 4) {
                // Colección 2: Nombres cortos (Frases muy dulces y tiernas)
                messages = [
                    `${userName}, tu sonrisa ilumina más que todas las estrellas de este jardín.`,
                    "Eres la casualidad más hermosa que me ha pasado en la vida.",
                    "Contigo, cada momento ordinario se siente como pura magia.",
                    "Quiero cuidar de tu corazón como se cuida a la flor más frágil.",
                    "Mi lugar favorito en el mundo entero es estar a tu lado.",
                    "Haces que todo lo malo desaparezca cuando me miras.",
                    "Eres un pedacito de cielo que cayó en mi vida, ${userName}.",
                    "Me encanta la paz que transmites con tu sola presencia.",
                    "Si pudieras verte a través de mis ojos, entenderías todo.",
                    "Toca las flores... están sonriendo por ti."
                ];
                finalMessage = `Eres muy especial, ${userName} ✨❤️`;

            } else if (nameKey.length >= 8) {
                // Colección 3: Nombres largos (Frases poéticas y del destino)
                messages = [
                    `${userName}, eres el arte que mis ojos nunca se cansarán de admirar.`,
                    "El universo conspiró durante milenios para que nuestros caminos se cruzaran.",
                    "Cada latido de mi corazón pronuncia tu nombre en un silencio perfecto.",
                    "Eres la poesía más profunda que nunca supe cómo escribir.",
                    "En tu mirada encuentro galaxias enteras en las que quiero perderme.",
                    "Las flores de este jardín palidecen ante la luz de tu alma.",
                    "Eres el misterio que quiero resolver todos los días de mi vida.",
                    "Mi tiempo se detiene cuando escucho tu voz, ${userName}.",
                    "Inspiras las cosas más bonitas que hay dentro de mí.",
                    "Toca este jardín... fue creado solo para que lo veas florecer."
                ];
                finalMessage = `Eres pura poesía, ${userName} 🌹✨`;

            } else {
                // Colección 4: Nombres promedio (Seducción romántica)
                messages = [
                    `${userName}, mi mente es un lienzo donde solo estás pintada tú.`,
                    "Tus labios son el único destino al que siempre quiero llegar.",
                    "El roce de tu piel se ha convertido en mi mayor debilidad.",
                    "Cada noche fantaseo con perderme en tu abrazo.",
                    "Despiertas en mí sentimientos que ni yo sabía que existían.",
                    "Tus ojos tienen un brillo que me hipnotiza sin remedio.",
                    "Contigo no quiero finales, solo quiero eternidades.",
                    "Me robaste el aliento desde el primer instante, ${userName}.",
                    "Qué ganas tengo de mirarte y detener el tiempo.",
                    "Toca las flores y siente cómo late este jardín por ti."
                ];
                finalMessage = `Me encantas, ${userName} ❤️`;
            }

            // Iniciar la animación
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                startMagic();
            }, 2000);
        });

        function startMagic() {
            createGarden();
            startFallingPetals();
            showMessages();
            
            const progressWrapper = document.getElementById('progress-wrapper');
            progressWrapper.style.opacity = '1';
            progressWrapper.classList.add('run-progress');

            // Termina la animación a los 60s
            setTimeout(() => {
                endAnimation();
            }, 60000);
        }

        function showMessages() {
            const msgContainer = document.getElementById('message-container');
            const msgText = document.getElementById('message-text');
            
            msgContainer.style.opacity = '1';
            msgText.innerText = messages[0];
            
            msgInterval = setInterval(() => {
                msgContainer.style.opacity = '0';
                
                msgTimeout = setTimeout(() => {
                    msgIndex++;
                    if(msgIndex < messages.length) {
                        msgText.innerText = messages[msgIndex];
                        msgContainer.style.opacity = '1';
                    }
                }, 1500);
            }, 6000); 
        }

        function endAnimation() {
            clearInterval(msgInterval);
            clearTimeout(msgTimeout);
            
            const msgContainer = document.getElementById('message-container');
            const msgText = document.getElementById('message-text');
            
            document.getElementById('progress-wrapper').style.opacity = '0';

            msgContainer.style.opacity = '0';
            setTimeout(() => {
                msgText.style.fontSize = "3.8rem"; 
                msgText.style.color = "#ff3399";
                msgText.innerText = finalMessage; // Usa el mensaje final personalizado
                msgText.style.fontWeight = "700";
                msgContainer.style.opacity = '1';
            }, 2000);
        }

        function createGarden() {
            const garden = document.getElementById('garden');
            const numFlowers = window.innerWidth < 600 ? 8 : 14; 

            for (let i = 0; i < numFlowers; i++) {
                setTimeout(() => {
                    const isRose = Math.random() > 0.6; 
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const size = 0.6 + Math.random() * 0.7; 
                    
                    const flower = document.createElement('div');
                    flower.className = 'flower-container grow';
                    flower.style.animationDelay = `${Math.random() * 1}s`; 
                    
                    setTimeout(() => {
                        flower.classList.add('sway');
                        flower.style.animationDelay = `${Math.random() * 3}s`; 
                    }, 3000);

                    if(isRose) {
                        flower.innerHTML = getRoseSVG(color, size);
                    } else {
                        flower.innerHTML = getTulipSVG(color, size);
                    }

                    flower.addEventListener('click', (e) => triggerBloom(e, flower, color));
                    flower.addEventListener('touchstart', (e) => triggerBloom(e, flower, color), {passive: true});

                    garden.appendChild(flower);
                }, i * 350); 
            }
        }

        function triggerBloom(e, flower, color) {
            e.preventDefault();
            if(flower.classList.contains('bloom')) return;
            
            flower.classList.add('bloom');
            
            for(let i=0; i<6; i++){
                createSinglePetal(e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth/2, 
                                  e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight/2, 
                                  color);
            }

            setTimeout(() => {
                flower.classList.remove('bloom');
            }, 700);
        }

        function startFallingPetals() {
            setInterval(() => {
                createSinglePetal(Math.random() * window.innerWidth, -20, null);
            }, 350); 
        }

        function createSinglePetal(x, y, specificColor) {
            const petalContainer = document.getElementById('petals-container');
            const petal = document.createElement('div');
            petal.className = 'falling-petal';
            
            const color = specificColor || colors[Math.floor(Math.random() * colors.length)];
            const size = 18 + Math.random() * 18; 
            const duration = 6 + Math.random() * 6; 
            
            petal.style.left = `${x}px`;
            petal.style.top = `${y}px`;
            petal.style.animationDuration = `${duration}s`;
            
            petal.innerHTML = `
                <svg width="${size}" height="${size*1.5}" viewBox="0 0 50 80" fill="${color}" xmlns="http://www.w3.org/2000/svg" style="opacity: 0.9; filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.4));">
                    <path d="M25 0 C10 20, 0 40, 5 60 C10 80, 40 80, 45 60 C50 40, 40 20, 25 0 Z"/>
                </svg>
            `;
            
            petalContainer.appendChild(petal);
            
            setTimeout(() => {
                petal.remove();
            }, duration * 1000);
        }

        // --- Generadores de SVG ---
        function getTulipSVG(color, scale) {
            return `
            <svg width="${100 * scale}" height="${300 * scale}" viewBox="0 0 100 300" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 100 Q45 200 50 300" stroke="#1f401f" stroke-width="7" fill="none"/>
                <path d="M50 250 Q20 200 10 150 Q30 220 50 250" fill="#2d5c2d"/>
                <path d="M50 220 Q80 160 90 120 Q70 190 50 220" fill="#1f401f"/>
                <path d="M30 40 Q50 20 70 40 Q80 80 50 100 Q20 80 30 40 Z" fill="${adjustColor(color, -35)}"/>
                <path d="M25 50 Q15 20 25 10 Q40 50 50 100 Q10 80 25 50 Z" fill="${adjustColor(color, -15)}"/>
                <path d="M75 50 Q85 20 75 10 Q60 50 50 100 Q90 80 75 50 Z" fill="${adjustColor(color, -15)}"/>
                <path d="M35 45 Q50 0 65 45 Q70 90 50 100 Q30 90 35 45 Z" fill="${color}"/>
            </svg>
            `;
        }

        function getRoseSVG(color, scale) {
            return `
            <svg width="${100 * scale}" height="${300 * scale}" viewBox="0 0 100 300" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 90 Q55 200 50 300" stroke="#1a331a" stroke-width="6" fill="none"/>
                <path d="M50 200 Q25 180 15 150 Q35 170 50 190" fill="#244d24"/>
                <path d="M52 180 L58 175 L53 185 Z" fill="#1a331a"/>
                <circle cx="50" cy="65" r="26" fill="${adjustColor(color, -45)}"/>
                <path d="M25 65 A 25 25 0 0 1 75 65 A 20 20 0 0 1 35 80 A 15 15 0 0 1 65 50 A 10 10 0 0 1 45 60" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"/>
                <path d="M20 60 Q50 101 80 60 Q71 30 50 40 Q29 30 20 60 Z" fill="${adjustColor(color, 15)}" opacity="0.85"/>
                <path d="M30 50 Q50 91 70 50 Q61 30 50 46 Q39 30 30 50 Z" fill="${color}"/>
            </svg>
            `;
        }

        function adjustColor(color, amount) {
            return '#' + color.replace(/^#/, '').replace(/../g, color => ('0'+Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
        }
    </script>
</body>
</html>
